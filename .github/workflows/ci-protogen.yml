name: CI Protogen Tool (.NET)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'tools/protogen/**'
      - 'Nalix.Native.slnx'
      - '.github/workflows/ci-protogen.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'tools/protogen/**'
      - 'Nalix.Native.slnx'
      - '.github/workflows/ci-protogen.yml'
  workflow_dispatch:

concurrency:
  group: ci-protogen-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-protogen:
    name: Build & Verify Protogen (.NET 10)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore tools/protogen/src/Protogen.slnx

    - name: Build Solution
      run: dotnet build tools/protogen/src/Protogen.slnx -c Release --no-restore

    - name: Run Unit Tests
      run: dotnet test tools/protogen/src/Protogen.slnx -c Release --no-build --verbosity normal
