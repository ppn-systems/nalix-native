name: CI NXProto Tool (.NET)

on:
  push:
    branches: [ main, master ]
    paths:
      - 'nxproto/**'
      - '.github/workflows/ci-nxproto.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'nxproto/**'
      - '.github/workflows/ci-nxproto.yml'
  workflow_dispatch:

concurrency:
  group: ci-nxproto-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test-nxproto:
    name: Build & Verify NXProto (.NET 10)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore nxproto/NXProto.slnx

    - name: Build Solution
      run: dotnet build nxproto/NXProto.slnx -c Release --no-restore

    - name: Run Tests (All 4 Projects)
      run: dotnet test nxproto/NXProto.slnx -c Release --no-build --verbosity normal
