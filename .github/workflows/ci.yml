name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build and Verify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Restore Dependencies
      run: dotnet restore Nalix.Native.slnx

    - name: Build Solution
      run: dotnet build Nalix.Native.slnx -c Release --no-restore

    - name: Run Protogen Unit Tests
      run: dotnet test Nalix.Native.slnx -c Release --no-build --verbosity normal

    - name: Run C Client Tests
      run: |
        gcc -Wall -Wextra -Iclients/c/include clients/c/src/status.c clients/c/src/packet.c clients/c/src/client.c clients/c/tests/client_test.c -o client_test
        ./client_test

    - name: Run C Binding Tests
      run: |
        gcc -Wall -Wextra -Iexamples/c/include examples/c/src/packets.c examples/c/tests/packet_test.c -o packet_test
        ./packet_test

    - name: Run Rust Client Tests
      run: cargo test --manifest-path clients/rust/Cargo.toml

    - name: Run Rust Binding Tests
      run: cargo test --manifest-path examples/rust/Cargo.toml
