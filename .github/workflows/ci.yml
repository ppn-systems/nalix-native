name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    name: Build and Verify
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Setup Rust Toolchain
      uses: dtolnay/rust-toolchain@stable

    - name: Restore Dependencies
      run: dotnet restore src/Protogen.slnx

    - name: Build Solution
      run: dotnet build src/Protogen.slnx -c Release --no-restore

    - name: Run Unit Tests
      run: dotnet test src/Protogen.slnx -c Release --no-build --verbosity normal

    - name: Run C Binding Tests
      run: |
        gcc -Iexamples/c/include examples/c/src/packets.c examples/c/tests/packet_test.c -o packet_test
        ./packet_test

    - name: Run Rust Binding Tests
      run: cargo test --manifest-path examples/rust/Cargo.toml
