name: "Publish: TypeScript SDK"

on:
  release:
    types: [published]
  push:
    tags:
      - 'v*'
      - 'ts-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (without v prefix, e.g. 0.1.0)'
        required: false

permissions:
  contents: write
  packages: write

jobs:
  publish:
    name: "Publish TypeScript SDK (@ppnsys/nalix-sdk)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - name: Extract Target Version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ github.event.inputs.version }}" ]; then
            version="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" == "release" ]; then
            version="${{ github.event.release.tag_name }}"
            version="${version#v}"
          elif [ -n "${{ github.ref_name }}" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.1.0"
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "Target publishing version: $version"

      - name: Install Dependencies
        working-directory: clients/ts
        run: npm ci

      - name: Update Version in package.json
        working-directory: clients/ts
        run: npm version "${{ env.VERSION }}" --no-git-tag-version --allow-same-version

      - name: Run Test Suite
        working-directory: clients/ts
        run: npm test

      # -----------------------------------------------------------------------
      # 1. Publish to npm public registry (npmjs.com)
      # -----------------------------------------------------------------------
      - name: Publish to npm public registry
        working-directory: clients/ts
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            echo "Publishing @ppnsys/nalix-sdk to npmjs.org..."
            npm publish --access public
          else
            echo "⚠️ Secret NPM_TOKEN is not configured. Skipping publish to npmjs.org."
          fi

      # -----------------------------------------------------------------------
      # 2. Publish to GitHub Packages (npm.pkg.github.com)
      # -----------------------------------------------------------------------
      - name: Publish to GitHub Packages
        working-directory: clients/ts
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "@${{ vars.NPM_ORG || 'ppnsys' }}:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          npm publish || echo "Package version ${{ env.VERSION }} already published on GitHub Packages or skipped."
